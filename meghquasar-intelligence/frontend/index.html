<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeghQuasar Intelligence</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { height: 70vh; }
    .panel { padding: 12px; }
    input, button { padding: 6px; margin-right: 8px; }
    pre { background: #f3f3f3; padding: 8px; max-height: 220px; overflow: auto; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>MeghQuasar Aviation Intelligence</h2>
    <input id="origin" placeholder="Origin (e.g., KTEB)" value="KTEB" />
    <input id="destination" placeholder="Destination (e.g., KLAX)" value="KLAX" />
    <button id="analyzeBtn">Analyze Route</button>
    <div id="summary"></div>
  </div>
  <div id="map"></div>
  <div class="panel">
    <h3>Analysis Output</h3>
    <pre id="output"></pre>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
